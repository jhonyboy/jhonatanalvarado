    <script>
      // Evita el parpadeo de tema incorrecto antes de que React hidrate.
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'portfolio-dark' : 'portfolio-light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', dark ? '#0b1120' : '#ffffff');
        } catch (error) {
          document.documentElement.dataset.theme = 'portfolio-light';
        }
      })();
    </script>
